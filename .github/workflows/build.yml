name: "Build & Smoke Test"

# Gives this repo real, visible build history in the GitHub Actions tab —
# separate from the Frogbot scan workflows. The app-boot/smoke-test steps run
# against the public npm registry so this job stays reliable regardless of
# Artifactory-side policy state. Once that's green, a second set of steps
# re-installs via `jf npm install` (routed through Artifactory per
# .jfrog/projects/npm.yaml) purely to publish build-info and trigger an Xray
# build-scan under the jackcu project, so this build shows up in Xray's
# Builds list. Those steps are `continue-on-error` — Artifactory/Xray-side
# flakiness (curation propagation, indexing config) shouldn't fail the
# core "does the app run" check above it.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    environment: frogbot

    services:
      mongo:
        image: mongo:4.4
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      MONGODB_URI: mongodb://localhost:27017/nodegoat
      NODE_ENV: test
      JF_URL: ${{ vars.JF_URL }}
      JF_PROJECT: ${{ vars.JF_PROJECT }}
      BUILD_NAME: nodegoat-golden-jas-demo
      BUILD_NUMBER: ${{ github.run_number }}-${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "12.x"

      - name: Install dependencies
        run: npm install

      - name: Lint (jshint via grunt)
        run: node node_modules/grunt-cli/bin/grunt jshint
        continue-on-error: true

      - name: Seed database
        run: npm run db:seed

      - name: Start app and smoke-test it
        run: |
          npm start &
          APP_PID=$!
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/ -o /dev/null; then
              echo "NodeGoat responded successfully"
              kill $APP_PID
              exit 0
            fi
            sleep 1
          done
          echo "NodeGoat did not respond in time"
          kill $APP_PID
          exit 1

      # --- JFrog build-info + Xray scan (best-effort, does not gate the job) ---

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        continue-on-error: true
        with:
          oidc-provider-name: jackcu-github-oidc
          oidc-audience: jfrog-jackcu-solengeu

      - name: Publish build-info to Artifactory
        continue-on-error: true
        run: |
          jf rt build-collect-env "$BUILD_NAME" "$BUILD_NUMBER"
          jf rt build-add-git "$BUILD_NAME" "$BUILD_NUMBER"
          rm -rf node_modules
          jf npm install --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"
          jf rt build-publish "$BUILD_NAME" "$BUILD_NUMBER" --project "$JF_PROJECT"

      - name: Trigger Xray build scan
        continue-on-error: true
        run: jf build-scan "$BUILD_NAME" "$BUILD_NUMBER" --project "$JF_PROJECT"
