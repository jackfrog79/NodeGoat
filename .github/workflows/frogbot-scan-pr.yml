name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
  id-token: write
jobs:
  scan-pr:
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: jfrog/frogbot@v3
        with:
          oidc-provider-name: jackcu-github-oidc
          oidc-audience: jfrog-jackcu-solengeu
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_INCLUDE_ALL_VULNERABILITIES: "TRUE"

          # Resolve npm dependencies through Artifactory (Curation-aware) instead of the public registry
          JF_DEPS_REPO: "jackcu-npm-virtual"

          # Drop Low severity noise, keep test/build dirs out of the scan
          JF_MIN_SEVERITY: "Medium"
          JF_PATH_EXCLUSIONS: "*git*;*node_modules*;*test*;*cypress*"

          # Fail the PR status check when security issues are found (blocks merge)
          JF_FAIL: "true"

          # Show full scan detail in PR comments instead of the trimmed summary
          JF_AVOID_EXTRA_MESSAGES: "false"
          JF_PR_COMMENT_TITLE: "🐸 JFrog Security Scan Results"

          # Re-post a fresh comment each run instead of leaving stale ones around
          JF_AVOID_PREVIOUS_PR_COMMENTS_DELETION: "false"

          JF_SAST_DEFAULT_SCAN_MODE: "codebase"
          ENABLE_CUSTOM_SECRETS_SCANNER: "true"