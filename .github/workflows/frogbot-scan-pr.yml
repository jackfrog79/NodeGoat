name: "Frogbot Scan Pull Request"
on:
  pull_request_target:
    types: [opened, synchronize]
permissions:
  pull-requests: write
  contents: read
  id-token: write
jobs:
  scan-pr:
    runs-on: ubuntu-latest
    environment: frogbot
    steps:
      - uses: jfrog/frogbot@v2
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JFROG_CLI_RELEASES_REPO: ""
          JF_OIDC_PROVIDER_NAME: jackcu-github-oidc
          JF_INSTALL_DEPS_CMD: "npm install --legacy-peer-deps"