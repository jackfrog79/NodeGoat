# JAS Services-scan demo fixture (NGINX). Wired into
# docker-compose.services-demo.yml — NOT into the app's main
# docker-compose.yml.
#
# Findings demonstrated (JFrog Misconfiguration Scans -> Services -> NGINX):
#  - Missing HTTPS redirect / TLS enforcement: server only listens on
#    plaintext 80, no redirect to a TLS listener.
#  - Weak crypto: TLSv1/TLSv1.1 accepted, weak cipher suite.
#  - Exposed admin interface: /nginx_status stub_status exposed with no
#    auth or IP allowlist.

events {}

http {
    server {
        listen 80; # Vulnerable: plaintext only, no redirect to HTTPS

        location /nginx_status {
            # Vulnerable: exposes internal server metrics with no auth,
            # no allow/deny restriction.
            stub_status on;
        }

        location / {
            proxy_pass http://web:4000;
        }
    }

    # Vulnerable: legacy TLS protocols and a weak/export-grade cipher suite.
    ssl_protocols       TLSv1 TLSv1.1;
    ssl_ciphers         "DES-CBC3-SHA:RC4-MD5";
}
